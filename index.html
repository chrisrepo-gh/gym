<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>Training Log — John Reed</title>
<style>
  :root{
    --bg:#111114; --card:#1b1b20; --card2:#232329; --line:#2e2e36;
    --txt:#f2f2f4; --dim:#9a9aa6; --accent:#ff2e88; --ok:#37d67a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 0 96px; -webkit-text-size-adjust:100%;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(17,17,20,.96);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 16px 0; padding-top:calc(14px + env(safe-area-inset-top));
  }
  h1{font-size:17px; margin:0 0 2px; letter-spacing:.02em}
  .sub{font-size:12px; color:var(--dim); margin:0 0 12px}
  .tabs{display:flex; gap:8px; padding-bottom:12px}
  .tab{
    flex:1; padding:11px 6px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); border-radius:11px; font-size:13px; font-weight:600;
    text-align:center; cursor:pointer; user-select:none;
  }
  .tab b{display:block; font-size:16px; color:var(--txt); line-height:1.3}
  .tab.on{border-color:var(--accent); background:#26121c}
  .tab.on b{color:var(--accent)}
  main{padding:16px 16px 0; max-width:640px; margin:0 auto}
  .dayhead{font-size:13px; color:var(--dim); margin:0 0 14px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden;
  }
  .card.opt{opacity:.75}
  .top{display:flex; gap:12px; padding:12px}
  .thumb{
    width:78px; height:78px; flex:0 0 78px; border-radius:10px; overflow:hidden;
    background:var(--card2); display:flex; align-items:center; justify-content:center;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .ph{font-size:9px; color:#61616d; text-align:center; padding:4px; word-break:break-all; line-height:1.25}
  .meta{min-width:0; flex:1}
  .name{font-size:15px; font-weight:650; margin:1px 0 4px}
  .target{font-size:12.5px; color:var(--dim)}
  .badges{margin-top:6px; display:flex; flex-wrap:wrap; gap:5px}
  .b{font-size:10px; padding:3px 7px; border-radius:20px; border:1px solid var(--line); color:var(--dim)}
  .b.free{border-color:#4a3a12; background:#231a06; color:#e8b93c}
  .b.leg{border-color:#123c4a; background:#07222b; color:#5ec8e5}
  .b.up{border-color:#14512e; background:#0c2a19; color:var(--ok)}
  .cue{font-size:12.5px; color:var(--dim); padding:0 12px 10px; margin:-2px 0 0}
  .sets{border-top:1px solid var(--line); padding:10px 12px 12px}
  .last{font-size:12px; color:var(--dim); margin:0 0 9px}
  .last b{color:#c9c9d2; font-weight:600}
  .row{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .row:last-child{margin-bottom:0}
  .sn{width:22px; font-size:12px; color:var(--dim); flex:0 0 22px}
  .fld{flex:1; position:relative}
  .fld input{
    width:100%; padding:12px 40px 12px 12px; font-size:17px; font-weight:600;
    background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); outline:none;
  }
  .fld input:focus{border-color:var(--accent)}
  .fld span{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--dim); pointer-events:none;
  }
  .stats{font-size:11.5px; color:var(--dim); margin:0 0 10px}
  .stats b{color:#c9c9d2; font-weight:600}
  .okbox{border:1px solid #14512e; background:#0c2a19; border-radius:11px; padding:14px; margin:0 0 12px}
  .okbox h3{margin:0 0 6px; font-size:15px; color:var(--ok)}
  .okbox p{margin:0; font-size:13px; color:#bfe6cd; line-height:1.5}
  .badbox{border:1px solid #5a1b25; background:#2a0c12; border-radius:11px; padding:14px; margin:0 0 12px}
  .badbox h3{margin:0 0 6px; font-size:15px; color:#ff8b9b}
  .badbox p{margin:0; font-size:13px; color:#ffc4cd; line-height:1.5}
  .chk{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--dim); margin:10px 0 0}
  .chk input{width:18px; height:18px; margin:0; accent-color:var(--accent)}
  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 9px;
    border-radius:20px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); cursor:pointer; margin:0 0 10px;
  }
  .pill i{width:7px; height:7px; border-radius:50%; background:var(--dim); font-style:normal}
  .pill.ok i{background:var(--ok)} .pill.ok{color:#8fe0ae; border-color:#14512e}
  .pill.wait i{background:#e8b93c} .pill.wait{color:#e8b93c; border-color:#4a3a12}
  .pill.err i{background:#ff5169} .pill.err{color:#ff8b9b; border-color:#5a1b25}
  .dlg input{
    width:100%; padding:11px 12px; margin:0 0 8px; background:var(--card2); color:var(--txt);
    border:1px solid var(--line); border-radius:9px; font-size:15px; outline:none;
  }
  .dlg input:focus{border-color:var(--accent)}
  .dlg label{font-size:11.5px; color:var(--dim); display:block; margin:0 0 3px}
  .warn{font-size:12px; color:#e8b93c; margin:10px 0 0; line-height:1.4}
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(17,17,20,.97); border-top:1px solid var(--line); backdrop-filter:blur(8px);
  }
  button{
    font:inherit; font-weight:650; border-radius:11px; border:1px solid var(--line);
    background:var(--card2); color:var(--txt); padding:13px 14px; cursor:pointer;
  }
  button.primary{flex:1; background:var(--accent); border-color:var(--accent); color:#fff}
  button.ghost{padding:13px 13px; color:var(--dim)}
  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(14px);
    background:#2b2b33; border:1px solid var(--line); color:var(--txt);
    padding:11px 16px; border-radius:11px; font-size:13.5px; z-index:40;
    opacity:0; pointer-events:none; transition:.22s; max-width:88vw; text-align:center;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  dialog{
    border:1px solid var(--line); background:var(--card); color:var(--txt);
    border-radius:var(--radius); padding:0; width:min(92vw,520px); max-height:80vh;
  }
  dialog::backdrop{background:rgba(0,0,0,.65)}
  .dlg{padding:18px}
  .dlg h2{font-size:16px; margin:0 0 10px}
  .dlg p{font-size:13.5px; color:var(--dim); margin:0 0 14px}
  .dlg textarea{
    width:100%; height:170px; background:var(--card2); color:var(--txt);
    border:1px solid var(--line); border-radius:10px; padding:10px;
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical;
  }
  .dlgbtns{display:flex; gap:8px; margin-top:12px}
  .dlgbtns button{flex:1}
  .hist{font-size:13px; color:var(--dim)}
  .hist div{padding:7px 0; border-bottom:1px solid var(--line)}
  .hist div:last-child{border:0}
</style>
</head>
<body>

<header>
  <h1>Training Log</h1>
  <p class="sub">John Reed · 3×/week · hypertrophy</p>
  <div class="pill" id="pill" title="Sync status"><i></i><span>not set up</span></div>
  <p class="stats" id="stats"></p>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <p class="dayhead" id="dayhead"></p>
  <div id="list"></div>
</main>

<div class="bar">
  <button class="primary" id="save">Finish session</button>
  <button class="ghost" id="data">Data</button>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

/* ------------------------- GitHub sync -------------------------
   Writes the whole log to <owner>/<repo>/<path> on every finish, and
   retries on load if the last attempt failed (no signal at the gym).
   The token is stored only in this browser and is never in the source.
----------------------------------------------------------------*/
const SKEY = "jr-gym-sync-v1";
let CFG = (()=>{ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } })();
function saveCfg(){ try{ localStorage.setItem(SKEY, JSON.stringify(CFG)); }catch(e){} }
function configured(){ return !!(CFG.owner && CFG.repo && CFG.token); }

function b64utf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}

async function ghWrite(){
  const path   = CFG.path   || "log.json";
  const branch = CFG.branch || "main";
  const url = "https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/contents/"+path;
  const h = { "Authorization":"Bearer "+CFG.token,
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28" };
  let sha;
  const g = await fetch(url+"?ref="+encodeURIComponent(branch), {headers:h});
  if(g.status === 200){ sha = (await g.json()).sha; }
  else if(g.status === 401){ throw new Error("token rejected (401) — expired or wrong"); }
  else if(g.status === 403){ throw new Error("forbidden (403) — token lacks Contents: write"); }
  else if(g.status !== 404){ throw new Error("read failed ("+g.status+")"); }
  const body = { message:"training log "+new Date().toISOString().slice(0,16).replace("T"," "),
                 content:b64utf8(JSON.stringify(S,null,1)), branch:branch };
  if(sha) body.sha = sha;
  const p = await fetch(url, {method:"PUT", headers:h, body:JSON.stringify(body)});
  if(p.status !== 200 && p.status !== 201){
    let d=""; try{ d=(await p.json()).message||""; }catch(e){}
    throw new Error("write failed ("+p.status+") "+d);
  }
}

let syncing = false;
async function sync(manual){
  if(syncing) return;
  if(!configured()){ paint(); if(manual) toast("Set up sync first (Data → Cloud sync)."); return; }
  if(!CFG.dirty && !manual){ paint(); return; }
  syncing = true; paint("…");
  try{
    await ghWrite();
    CFG.dirty = false; CFG.lastOk = new Date().toISOString(); CFG.lastErr = "";
    saveCfg(); paint();
    if(manual) toast("Synced.");
  }catch(e){
    CFG.lastErr = (navigator.onLine === false ? "offline — will retry" : String(e.message||e));
    saveCfg(); paint();
    if(manual) toast("Sync failed: "+CFG.lastErr);
  }finally{ syncing = false; }
}

function paint(busy){
  const el = document.getElementById("pill"); if(!el) return;
  const txt = el.querySelector("span");
  el.className = "pill";
  if(busy){ txt.textContent = "syncing…"; return; }
  if(!configured()){ txt.textContent = "sync not set up"; return; }
  if(CFG.lastErr){
    el.classList.add("err");
    txt.textContent = (CFG.dirty ? "not synced — " : "sync problem — ") + CFG.lastErr;
    return;
  }
  if(CFG.dirty){
    el.classList.add("wait");
    txt.textContent = "not synced — tap to retry";
    return;
  }
  el.classList.add("ok");
  txt.textContent = "synced " + (CFG.lastOk ? new Date(CFG.lastOk).toLocaleString(undefined,
      {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "");
}

/* ------------------------------ state ------------------------------ */
const KEY = "jr-gym-v1";
const blank = () => ({history:[], drafts:{A:{},B:{},C:{}}});
let S = load();
let day = localStorage.getItem(KEY+"-day") || "A";
let edited = false, confirmSave = false;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    return {history: p.history||[], drafts: Object.assign({A:{},B:{},C:{}}, p.drafts||{})};
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Could not save — browser storage is full or blocked."); }
}

/* returns the most recent completed session's sets for an exercise */
function lastSets(id){
  for(let i=S.history.length-1; i>=0; i--){
    const e = S.history[i].entries[id];
    if(e && e.some(s=>s.w||s.r)) return {sets:e, date:S.history[i].date};
  }
  return null;
}
function draftFor(ex){
  const d = S.drafts[day];
  if(!d[ex.id] || d[ex.id].length !== ex.sets){
    const prev = lastSets(ex.id);
    const had  = d[ex.id];
    d[ex.id] = Array.from({length:ex.sets}, (_,i)=>{
      if(had && had[i]) return had[i];
      const p = prev && prev.sets[i];              // start from where you finished last time
      return p ? {w:p.w||"", r:p.r||""} : {w:"", r:""};
    });
  }
  return d[ex.id];
}



function dayKey(d){
  const x = (d instanceof Date) ? d : new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
/* index of an existing entry for the same calendar day AND the same day-type */
function findEntry(hist, key, dayType){
  for(let i=hist.length-1; i>=0; i--)
    if(hist[i].day === dayType && dayKey(hist[i].date) === key) return i;
  return -1;
}
/* collapse any pre-existing same-day duplicates, keeping the most recent of each */
function dedupeHistory(){
  const seen = new Set(), keep = [];
  for(let i=S.history.length-1; i>=0; i--){
    const h=S.history[i], k=h.day+"|"+dayKey(h.date);
    if(seen.has(k)) continue;
    seen.add(k); keep.unshift(h);
  }
  const removed = S.history.length - keep.length;
  if(removed){ S.history = keep; save(); }
  return removed;
}

/* Reads the store back from scratch to prove what is actually on disk. */
function readBack(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return {ok:false, n:0, msg:"storage is empty"};
    const p = JSON.parse(raw);
    if(!Array.isArray(p.history)) return {ok:false, n:0, msg:"no history in storage"};
    return {ok:true, n:p.history.length, history:p.history, last:p.history[p.history.length-1]};
  }catch(e){ return {ok:false, n:0, msg:String(e.message||e)}; }
}

function paintStats(){
  const el=document.getElementById("stats"); if(!el) return;
  const r=readBack();
  if(!r.ok || !r.n){ el.innerHTML="No sessions saved yet."; return; }
  const d=new Date(r.last.date);
  el.innerHTML="<b>"+r.n+"</b> session"+(r.n===1?"":"s")+" saved on this phone · last: Day <b>"+
    r.last.day+"</b>, "+d.toLocaleDateString(undefined,{day:"2-digit",month:"2-digit"})+
    " "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}

function logBlobUrl(){
  return URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
}
function downloadLog(name){
  const a=document.createElement("a");
  a.href=logBlobUrl(); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ------------------------------ render ------------------------------ */
const tabsEl=document.getElementById("tabs"), listEl=document.getElementById("list"),
      headEl=document.getElementById("dayhead");

function renderTabs(){
  tabsEl.innerHTML="";
  ["A","B","C"].forEach(k=>{
    const t=document.createElement("div");
    t.className="tab"+(k===day?" on":"");
    t.innerHTML="<b>"+k+"</b>"+({A:"Push",B:"Pull",C:"Mixed"})[k];
    t.onclick=()=>{ day=k; localStorage.setItem(KEY+"-day",k); render(); window.scrollTo(0,0); };
    tabsEl.appendChild(t);
  });
}

function render(){
  edited = false; confirmSave = false;
  paintStats();
  renderTabs();
  const P=PLAN[day];
  headEl.textContent=P.title;
  listEl.innerHTML="";

  P.ex.forEach(ex=>{
    const d=draftFor(ex), prev=lastSets(ex.id);
    const card=document.createElement("div");
    card.className="card"+(ex.opt?" opt":"");

    /* --- header --- */
    const top=document.createElement("div"); top.className="top";
    const th=document.createElement("div"); th.className="thumb";
    if(IMG[ex.id]){
      const im=document.createElement("img");
      im.src=IMG[ex.id]; im.alt=ex.name; im.decoding="async";
      th.appendChild(im);
    } else {
      th.innerHTML='<div class="ph">no image<br>yet</div>';
    }

    const meta=document.createElement("div"); meta.className="meta";
    meta.innerHTML='<div class="name"></div>'+
      '<div class="target">'+ex.sets+' × '+ex.lo+'–'+ex.hi+' reps · rest '+ex.rest+'</div>'+
      '<div class="badges"></div>';
    meta.querySelector(".name").textContent=ex.name;
    const bg=meta.querySelector(".badges");
    if(ex.free){ const b=document.createElement("span"); b.className="b free"; b.textContent="free weight"; bg.appendChild(b); }
    if(ex.leg){ const b=document.createElement("span"); b.className="b leg"; b.textContent="legs"; bg.appendChild(b); }
    if(ex.opt){ const b=document.createElement("span"); b.className="b"; b.textContent="optional"; bg.appendChild(b); }
    const upEl=document.createElement("span"); upEl.className="b up"; upEl.textContent="↑ add weight next time";
    upEl.style.display="none"; bg.appendChild(upEl);

    top.appendChild(th); top.appendChild(meta); card.appendChild(top);

    const cue=document.createElement("p"); cue.className="cue"; cue.textContent=ex.cue;
    card.appendChild(cue);

    /* --- sets --- */
    const wrap=document.createElement("div"); wrap.className="sets";
    const lastLine=document.createElement("p"); lastLine.className="last";
    if(prev){
      lastLine.innerHTML="Carried over from "+fmtDate(prev.date)+": <b>"+
        prev.sets.map(s=>(s.w||"–")+"×"+(s.r||"–")).join("  ·  ")+"</b> — adjust as you go";
    } else {
      lastLine.textContent="No previous entry yet.";
    }
    wrap.appendChild(lastLine);

    d.forEach((set,i)=>{
      const row=document.createElement("div"); row.className="row";
      row.innerHTML='<div class="sn">'+(i+1)+'</div>';
      row.appendChild(field(set,"w","kg",prev&&prev.sets[i]?prev.sets[i].w:""));
      row.appendChild(field(set,"r","reps",prev&&prev.sets[i]?prev.sets[i].r:""));
      wrap.appendChild(row);
    });

    function field(set,k,unit,ph){
      const f=document.createElement("div"); f.className="fld";
      const inp=document.createElement("input");
      inp.type="text"; inp.inputMode="decimal"; inp.value=set[k]||"";
      inp.placeholder=ph!==""&&ph!=null?String(ph):"";
      inp.oninput=()=>{ set[k]=inp.value.replace(",","."); edited=true; confirmSave=false; save(); checkUp(); };
      const u=document.createElement("span"); u.textContent=unit;
      f.appendChild(inp); f.appendChild(u); return f;
    }

    function checkUp(){
      const done=d.every(s=>s.w!==""&&s.r!=="");
      const top_=d.every(s=>parseFloat(s.r)>=ex.hi);
      upEl.style.display=(done&&top_)?"":"none";
    }
    checkUp();

    card.appendChild(wrap);
    listEl.appendChild(card);
  });
}

function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"2-digit"});
}

/* ------------------------------ actions ------------------------------ */
document.getElementById("save").onclick=()=>{
  const d=S.drafts[day];
  const entries={}; let n=0;
  Object.keys(d).forEach(id=>{
    const sets=d[id].filter(s=>s.w!==""||s.r!=="");
    if(sets.length){ entries[id]=d[id].map(s=>({w:s.w,r:s.r})); n+=sets.length; }
  });
  if(!n){ toast("Nothing logged yet."); return; }
  if(!edited && !confirmSave){
    confirmSave = true;
    toast("These are last session's numbers — tap Finish again to save them as today.");
    return;
  }
  const before = readBack().n;
  const key = dayKey(new Date());
  const at  = findEntry(S.history, key, day);
  const rec = {day:day, date:new Date().toISOString(), entries:entries};
  const replaced = at >= 0;
  if(replaced) S.history[at] = rec; else S.history.push(rec);
  S.drafts[day]={};
  CFG.dirty = true; saveCfg();
  save();
  const after = readBack();                     // proof, not a promise
  const expect = before + (replaced ? 0 : 1);
  const idx = after.ok ? findEntry(after.history, key, day) : -1;
  const stored = after.ok && after.n === expect && idx >= 0;
  render(); window.scrollTo(0,0);
  showSaveResult(stored, day, n, after, replaced);
  if(stored && CFG.autoDl) downloadLog("training-"+new Date().toISOString().slice(0,10)+"-day"+day+".json");
  sync(false);
};

document.getElementById("data").onclick=()=>openData();

function openData(){
  const dlg=document.getElementById("dlg"), b=document.getElementById("dlgbody");
  const json=JSON.stringify(S);
  b.innerHTML=
    '<h2>Cloud sync</h2>'+
    '<p>Writes your whole log to a <b>private</b> GitHub repo after every finished session. '+
    'The token is stored only in this browser — it is not in the page source and nobody else can read it. '+
    'Use a fine-grained token scoped to that one repo, with <b>Contents: Read and write</b>.</p>'+
    '<label>Repo owner</label><input id="s_owner" autocapitalize="off" autocorrect="off" placeholder="chrisrepo-gh">'+
    '<label>Private repo name</label><input id="s_repo" autocapitalize="off" autocorrect="off" placeholder="gym-log">'+
    '<label>Token</label><input id="s_tok" type="password" autocomplete="off" placeholder="github_pat_...">'+
    '<div class="dlgbtns"><button id="s_save">Save</button><button id="s_test">Save &amp; sync now</button></div>'+
    '<p class="warn" id="s_state"></p>'+
    '<label class="chk"><input type="checkbox" id="s_auto"> Also download a JSON copy to my phone after every session</label>'+
    '<h2 style="margin-top:22px">Data</h2>'+
    '<p>'+S.history.length+' saved session(s). Copy or download the text below to keep a manual '+
    'backup — paste it back here to restore.</p>'+
    '<textarea id="ta" spellcheck="false"></textarea>'+
    '<div class="dlgbtns">'+
      '<button id="cp">Copy</button>'+
      '<button id="dl">Download</button>'+
      '<button id="imp">Restore</button>'+
    '</div>'+
    '<div class="dlgbtns"><button id="cl">Close</button></div>'+
    '<h2 style="margin-top:18px">History</h2>'+
    '<div class="hist" id="hs"></div>';
  b.querySelector("#ta").value=json;

  const hs=b.querySelector("#hs");
  if(!S.history.length){ hs.textContent="Nothing saved yet."; }
  else{
    S.history.slice().reverse().slice(0,20).forEach(h=>{
      const n=Object.values(h.entries).reduce((a,s)=>a+s.filter(x=>x.w||x.r).length,0);
      const el=document.createElement("div");
      el.textContent=new Date(h.date).toLocaleDateString()+" — Day "+h.day+", "+n+" sets";
      hs.appendChild(el);
    });
  }

  b.querySelector("#cp").onclick=()=>{
    const ta=b.querySelector("#ta"); ta.select(); ta.setSelectionRange(0,99999);
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject())
      .then(()=>toast("Copied.")).catch(()=>{document.execCommand("copy"); toast("Copied.");});
  };
  b.querySelector("#dl").onclick=()=>{
    const blob=new Blob([b.querySelector("#ta").value],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="training-log-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href); toast("Downloaded.");
  };
  b.querySelector("#imp").onclick=()=>{
    try{
      const p=JSON.parse(b.querySelector("#ta").value);
      if(!p || !Array.isArray(p.history)) throw 0;
      S={history:p.history, drafts:Object.assign({A:{},B:{},C:{}},p.drafts||{})};
      save(); render(); dlg.close(); toast("Restored.");
    }catch(e){ toast("That is not a valid backup."); }
  };
  b.querySelector("#s_owner").value = CFG.owner||"";
  b.querySelector("#s_repo").value  = CFG.repo||"";
  b.querySelector("#s_tok").value   = CFG.token||"";
  const st=b.querySelector("#s_state");
  st.textContent = !configured() ? "Not set up — your log exists only on this phone."
    : CFG.dirty ? ("Not synced. "+(CFG.lastErr||"")) 
    : ("Last sync: "+(CFG.lastOk? new Date(CFG.lastOk).toLocaleString() : "never"));
  function grab(){
    CFG.owner=b.querySelector("#s_owner").value.trim();
    CFG.repo =b.querySelector("#s_repo").value.trim();
    CFG.token=b.querySelector("#s_tok").value.trim();
    saveCfg(); paint();
  }
  b.querySelector("#s_auto").checked = !!CFG.autoDl;
  b.querySelector("#s_auto").onchange=(e)=>{ CFG.autoDl=e.target.checked; saveCfg(); };
  b.querySelector("#s_save").onclick=()=>{ grab(); toast("Saved."); dlg.close(); };
  b.querySelector("#s_test").onclick=()=>{ grab(); dlg.close(); sync(true); };
  b.querySelector("#cl").onclick=()=>dlg.close();
  dlg.showModal();
}


function showSaveResult(ok, d, n, rb, replaced){
  const dlg=document.getElementById("dlg"), b=document.getElementById("dlgbody");
  if(ok){
    const when=new Date(rb.last.date);
    b.innerHTML =
      '<div class="okbox"><h3>&#10003; '+(replaced?"Updated":"Saved")+'</h3><p>'+
        'Day '+d+' &middot; '+when.toLocaleDateString()+' '+when.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})+
        '<br>'+n+' set'+(n===1?"":"s")+' written.<br>'+
        '<b>'+rb.n+'</b> session'+(rb.n===1?"":"s")+' now stored on this phone.'+
      '</p></div>'+
      '<p style="font-size:12.5px;color:var(--dim);margin:0 0 12px">Verified by reading the '+
      'storage back after writing — this is what is actually saved, not just a message.</p>'+
      '<div class="dlgbtns"><button id="k_ok">OK</button>'+
      '<button id="k_dl">Download this log</button></div>';
  } else {
    b.innerHTML =
      '<div class="badbox"><h3>&#9888; NOT saved</h3><p>'+
        'The session could not be written to this browser\'s storage.<br>'+
        (rb.msg ? "Reason: "+rb.msg+"<br>" : "")+
        'Likely causes: private/incognito mode, or storage full.'+
      '</p></div>'+
      '<p style="font-size:12.5px;color:var(--dim);margin:0 0 12px">Download the log now so '+
      'today is not lost, then reopen this page in a normal (non-private) tab.</p>'+
      '<div class="dlgbtns"><button id="k_dl">Download now</button><button id="k_ok">Close</button></div>';
  }
  b.querySelector("#k_ok").onclick=()=>dlg.close();
  b.querySelector("#k_dl").onclick=()=>downloadLog("training-log-"+new Date().toISOString().slice(0,10)+".json");
  dlg.showModal();
}

let tmr;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(tmr); tmr=setTimeout(()=>t.classList.remove("on"),2200);
}

const _dupes = dedupeHistory();
render();
paint();
paintStats();
if(_dupes) toast("Merged "+_dupes+" duplicate entr"+(_dupes===1?"y":"ies")+" from the same day.");
document.getElementById("pill").onclick = ()=> configured() ? sync(true) : openData();
window.addEventListener("online", ()=> sync(false));
if(CFG.dirty) sync(false);
</script>
</body>
</html>
